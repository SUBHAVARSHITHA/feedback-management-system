<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - FeedbackHub</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ADMIN DASHBOARD */

        .admin-dashboard {

            padding: 60px 8%;

            min-height: 70vh;

        }


        .admin-heading {

            text-align: center;

            margin-bottom: 40px;

        }


        .admin-heading h2 {

            color: #1f3b64;

            font-size: 32px;

            margin-bottom: 10px;

        }


        .admin-heading p {

            color: #666;

        }


        /* STAT CARDS */

        .admin-stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;

            margin-bottom: 50px;

        }


        .stat-card {

            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);

        }


        .stat-icon {

            font-size: 35px;

            margin-bottom: 10px;

        }


        .stat-card h3 {

            color: #1f3b64;

            margin-bottom: 10px;

        }


        .stat-card p {

            font-size: 28px;

            font-weight: bold;

            color: #333;

        }


        /* FEEDBACK SECTION */

        .admin-feedback-section {

            max-width: 1100px;

            margin: auto;

        }


        .admin-feedback-section h2 {

            text-align: center;

            color: #1f3b64;

            margin-bottom: 25px;

        }


        .admin-feedback-card {

            background: white;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);

        }


        .admin-feedback-card h3 {

            color: #1f3b64;

            margin-bottom: 5px;

        }


        .admin-email {

            color: #777;

            font-size: 14px;

        }


        .admin-rating {

            margin: 12px 0;

            font-size: 20px;

        }


        .admin-message {

            color: #444;

            line-height: 1.6;

        }


        .admin-date {

            color: #999;

            font-size: 13px;

            margin-top: 10px;

        }


        /* DELETE BUTTON */

        .delete-btn {

            margin-top: 15px;

            padding: 10px 18px;

            border: none;

            border-radius: 6px;

            background: #d9534f;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .delete-btn:hover {

            opacity: 0.9;

        }


        /* EMPTY MESSAGE */

        .no-feedback {

            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 12px;

            color: #777;

        }


        /* ADMIN BUTTONS */

        .admin-actions {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin: 35px 0;

            flex-wrap: wrap;

        }


        .admin-btn {

            padding: 12px 25px;

            border: none;

            border-radius: 6px;

            background: #1f3b64;

            color: white;

            text-decoration: none;

            cursor: pointer;

        }


        .admin-btn:hover {

            opacity: 0.9;

        }


        /* RESPONSIVE */

        @media (max-width: 768px) {

            .admin-stats {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <h1>
                Feedback<span>Hub</span>
            </h1>

        </div>


        <nav class="navbar">

            <a href="admin.html">
                Dashboard
            </a>

            <a href="view-feedback.html">
                User Feedback
            </a>

            <a href="index.html"
               onclick="adminLogout()">
                Logout
            </a>

        </nav>

    </header>


    <!-- ADMIN DASHBOARD -->

    <main class="admin-dashboard">


        <!-- HEADING -->

        <div class="admin-heading">

            <h2>
                Admin Dashboard
            </h2>

            <p>
                Manage and analyze user feedback
            </p>

        </div>


        <!-- STATISTICS -->

        <div class="admin-stats">


            <!-- TOTAL -->

            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <h3>
                    Total Feedback
                </h3>

                <p id="totalFeedback">
                    0
                </p>

            </div>


            <!-- AVERAGE -->

            <div class="stat-card">

                <div class="stat-icon">
                    ⭐
                </div>

                <h3>
                    Average Rating
                </h3>

                <p id="averageRating">
                    0
                </p>

            </div>


            <!-- EXCELLENT -->

            <div class="stat-card">

                <div class="stat-icon">
                    👍
                </div>

                <h3>
                    5 Star Feedback
                </h3>

                <p id="fiveStarFeedback">
                    0
                </p>

            </div>

        </div>


        <!-- ACTION BUTTONS -->

        <div class="admin-actions">

            <a
                href="feedback.html"
                class="admin-btn"
            >
                + Add Feedback
            </a>


            <a
                href="view-feedback.html"
                class="admin-btn"
            >
                View Feedback Page
            </a>


            <button
                class="admin-btn"
                onclick="refreshDashboard()"
            >
                🔄 Refresh
            </button>

        </div>


        <!-- ALL FEEDBACK -->

        <section class="admin-feedback-section">

            <h2>
                All User Feedback
            </h2>


            <div id="adminFeedbackList"></div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 FeedbackHub. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        /*
            ADMIN ACCESS CHECK
        */

        let adminLoggedIn =
            localStorage.getItem("adminLoggedIn");


        if (adminLoggedIn !== "true") {

            alert(
                "Please login as admin first."
            );

            window.location.href =
                "admin-login.html";

        }


        /*
            DISPLAY DASHBOARD
        */

        function loadAdminDashboard() {


            let feedbackList =
                JSON.parse(
                    localStorage.getItem("feedbackList")
                ) || [];


            /*
                TOTAL FEEDBACK
            */

            document.getElementById(
                "totalFeedback"
            ).textContent =
                feedbackList.length;


            /*
                AVERAGE RATING
            */

            let average = 0;


            if (feedbackList.length > 0) {

                let totalRating =
                    feedbackList.reduce(
                        function(total, feedback) {

                            return total +
                                Number(feedback.rating);

                        },
                        0
                    );


                average =
                    totalRating /
                    feedbackList.length;

            }


            document.getElementById(
                "averageRating"
            ).textContent =
                average.toFixed(1);


            /*
                FIVE STAR COUNT
            */

            let fiveStarCount =
                feedbackList.filter(
                    function(feedback) {

                        return Number(
                            feedback.rating
                        ) === 5;

                    }
                ).length;


            document.getElementById(
                "fiveStarFeedback"
            ).textContent =
                fiveStarCount;


            /*
                DISPLAY FEEDBACK
            */

            let container =
                document.getElementById(
                    "adminFeedbackList"
                );


            if (feedbackList.length === 0) {

                container.innerHTML = `

                    <div class="no-feedback">

                        <h3>
                            No Feedback Available
                        </h3>

                        <p>
                            Users have not submitted
                            any feedback yet.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            /*
                CREATE FEEDBACK CARDS
            */

            feedbackList.forEach(
                function(feedback, index) {


                    let stars =
                        "⭐".repeat(
                            Number(feedback.rating)
                        );


                    let card = `

                        <div class="admin-feedback-card">

                            <h3>
                                ${feedback.name}
                            </h3>


                            <p class="admin-email">

                                ${feedback.email}

                            </p>


                            <div class="admin-rating">

                                ${stars}

                            </div>


                            <p class="admin-message">

                                ${feedback.message}

                            </p>


                            <p class="admin-date">

                                Submitted on:
                                ${feedback.date}

                            </p>


                            <button
                                class="delete-btn"
                                onclick="deleteFeedback(${index})"
                            >
                                🗑️ Delete Feedback
                            </button>

                        </div>

                    `;


                    container.innerHTML += card;

                }
            );

        }


        /*
            DELETE FEEDBACK
        */

        function deleteFeedback(index) {


            let feedbackList =
                JSON.parse(
                    localStorage.getItem("feedbackList")
                ) || [];


            let confirmDelete =
                confirm(
                    "Are you sure you want to delete this feedback?"
                );


            if (!confirmDelete) {

                return;

            }


            feedbackList.splice(
                index,
                1
            );


            localStorage.setItem(
                "feedbackList",
                JSON.stringify(feedbackList)
            );


            alert(
                "Feedback deleted successfully."
            );


            loadAdminDashboard();

        }


        /*
            REFRESH
        */

        function refreshDashboard() {

            loadAdminDashboard();

            alert(
                "Dashboard refreshed successfully."
            );

        }


        /*
            LOGOUT
        */

        function adminLogout() {

            localStorage.removeItem(
                "adminLoggedIn"
            );

        }


        /*
            LOAD DASHBOARD
        */

        loadAdminDashboard();

    </script>

</body>

</html>
