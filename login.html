<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - FeedbackHub</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================= CREATE ACCOUNT POPUP ================= */

        .register-modal {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;

            align-items: center;

            z-index: 999;

        }


        .register-box {

            background: white;

            width: 90%;

            max-width: 450px;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.2);

            position: relative;

        }


        .register-box h2 {

            text-align: center;

            color: #1f3b64;

            margin-bottom: 10px;

        }


        .register-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }


        .close-register {

            position: absolute;

            top: 12px;

            right: 18px;

            font-size: 25px;

            cursor: pointer;

            color: #555;

        }


        .register-box input {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            margin-top: 7px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        .register-box label {

            font-weight: bold;

            color: #333;

        }


        .register-submit {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #1f3b64;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .register-submit:hover {

            opacity: 0.9;

        }

    </style>

</head>


<body class="login-page">


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <h1>
                Feedback<span>Hub</span>
            </h1>

        </div>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#features">
                Features
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- ================= LOGIN SECTION ================= -->

    <main class="login-page-container">

        <div class="login-box">


            <div class="login-icon">
                🔐
            </div>


            <h2>
                Welcome Back!
            </h2>


            <p class="login-subtitle">
                Login to your FeedbackHub account
            </p>



            <!-- LOGIN FORM -->

            <form onsubmit="loginUser(event)">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- LOGIN OPTIONS -->

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>



            <!-- CREATE ACCOUNT -->

            <p class="register-text">

                Don't have an account?

                <a
                    href="#"
                    onclick="openRegister(event)"
                >
                    Create Account
                </a>

            </p>



            <!-- BACK TO HOME -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>



    <!-- ================= CREATE ACCOUNT POPUP ================= -->

    <div
        class="register-modal"
        id="registerModal"
    >

        <div class="register-box">


            <!-- CLOSE -->

            <span
                class="close-register"
                onclick="closeRegister()"
            >
                ×
            </span>


            <h2>
                Create Account
            </h2>


            <p class="register-subtitle">
                Create your FeedbackHub account
            </p>



            <!-- REGISTER FORM -->

            <form onsubmit="createAccount(event)">


                <!-- NAME -->

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >



                <!-- EMAIL -->

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >



                <!-- PASSWORD -->

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >



                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >



                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="register-submit"
                >
                    Create Account
                </button>

            </form>

        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 FeedbackHub. All Rights Reserved.
            </p>

        </div>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= LOGIN ================= */

        function loginUser(event) {

            event.preventDefault();


            let email =
                document.getElementById("email")
                .value
                .trim();


            let password =
                document.getElementById("password")
                .value;


            /*
                Get registered users
            */

            let users =
                JSON.parse(
                    localStorage.getItem("users")
                ) || [];


            /*
                Check login details
            */

            let user =
                users.find(
                    function(account) {

                        return (
                            account.email === email &&
                            account.password === password
                        );

                    }
                );


            /*
                Login successful
            */

            if (user) {

                localStorage.setItem(
                    "loggedInUser",
                    user.email
                );


                localStorage.setItem(
                    "loggedInUserName",
                    user.name
                );


                alert(
                    "Login successful! Welcome to FeedbackHub."
                );


                window.location.href =
                    "user.html";

            }

            else {

                alert(
                    "Invalid email or password. Please create an account first."
                );

            }

        }



        /* ================= OPEN REGISTER ================= */

        function openRegister(event) {

            event.preventDefault();

            document.getElementById(
                "registerModal"
            ).style.display = "flex";

        }



        /* ================= CLOSE REGISTER ================= */

        function closeRegister() {

            document.getElementById(
                "registerModal"
            ).style.display = "none";

        }



        /* ================= CREATE ACCOUNT ================= */

        function createAccount(event) {

            event.preventDefault();


            let name =
                document.getElementById(
                    "registerName"
                ).value.trim();


            let email =
                document.getElementById(
                    "registerEmail"
                ).value.trim();


            let password =
                document.getElementById(
                    "registerPassword"
                ).value;


            let confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;



            /* CHECK PASSWORD */

            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;

            }



            /* GET USERS */

            let users =
                JSON.parse(
                    localStorage.getItem("users")
                ) || [];



            /* CHECK EMAIL */

            let existingUser =
                users.find(
                    function(user) {

                        return user.email === email;

                    }
                );


            if (existingUser) {

                alert(
                    "An account with this email already exists."
                );

                return;

            }



            /* CREATE USER */

            let newUser = {

                name: name,

                email: email,

                password: password

            };



            /* SAVE USER */

            users.push(newUser);


            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );



            /* SUCCESS */

            alert(
                "Account created successfully! Please login."
            );



            /* CLOSE POPUP */

            closeRegister();



            /* CLEAR REGISTER FORM */

            document.getElementById(
                "registerName"
            ).value = "";

            document.getElementById(
                "registerEmail"
            ).value = "";

            document.getElementById(
                "registerPassword"
            ).value = "";

            document.getElementById(
                "confirmPassword"
            ).value = "";

        }

    </script>


</body>

</html>
