<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Give Feedback - FeedbackHub</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <h1>
                Feedback<span>Hub</span>
            </h1>

        </div>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="user.html">
                Dashboard
            </a>

            <a href="feedback.html">
                Give Feedback
            </a>

            <a href="view-feedback.html">
                View Feedback
            </a>

        </nav>

    </header>


    <!-- FEEDBACK FORM -->

    <main class="login-page-container">

        <div class="login-box">

            <div class="login-icon">
                📝
            </div>


            <h2>
                Give Your Feedback
            </h2>


            <p class="login-subtitle">
                We value your opinion
            </p>


            <form onsubmit="submitFeedback(event)">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- RATING -->

                <div class="input-group">

                    <label for="rating">
                        Rating
                    </label>

                    <select
                        id="rating"
                        required
                    >

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ Excellent
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ Very Good
                        </option>

                        <option value="3">
                            ⭐⭐⭐ Good
                        </option>

                        <option value="2">
                            ⭐⭐ Needs Improvement
                        </option>

                        <option value="1">
                            ⭐ Poor
                        </option>

                    </select>

                </div>


                <!-- MESSAGE -->

                <div class="input-group">

                    <label for="message">
                        Your Feedback
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your feedback here..."
                        rows="5"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Submit Feedback
                </button>


            </form>


            <br>


            <a
                href="user.html"
                class="back-home"
            >
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        function submitFeedback(event) {

            event.preventDefault();


            // Get form values

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let rating =
                document.getElementById("rating").value;

            let message =
                document.getElementById("message").value.trim();


            // Create feedback object

            let feedback = {

                name: name,

                email: email,

                rating: rating,

                message: message,

                date: new Date().toLocaleString()

            };


            // Get existing feedback

            let feedbackList =
                JSON.parse(
                    localStorage.getItem("feedbackList")
                ) || [];


            // Add new feedback

            feedbackList.push(feedback);


            // Save feedback

            localStorage.setItem(
                "feedbackList",
                JSON.stringify(feedbackList)
            );


            // Success message

            alert(
                "Thank you! Your feedback has been submitted successfully."
            );


            // Open feedback display page

            window.location.href =
                "view-feedback.html";

        }

    </script>

</body>

</html>
